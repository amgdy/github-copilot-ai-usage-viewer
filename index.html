    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        var requested = new URLSearchParams(window.location.search).get('theme');
        var t = requested === 'light' || requested === 'dark' ? requested : localStorage.getItem('ghcu.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var palette = localStorage.getItem('ghcu.palette');
        if (palette === 'contrast' || palette === 'colorblind') document.documentElement.dataset.palette = palette;
        if (localStorage.getItem('ghcu.locale') === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {
        console.warn('Could not read the saved theme and language.', e);
      }
    </script>
