<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GitHub Copilot AI Usage Viewer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3E.r%7Bstroke:%231a1a17%7D.f%7Bfill:%230e6e74%7D@media (prefers-color-scheme:dark)%7B.r%7Bstroke:%23edece6%7D.f%7Bfill:%234fc2c4%7D%7D%3C/style%3E%3Ccircle class='r' cx='12' cy='12' r='10.25' fill='none' stroke-width='1.5'/%3E%3Cpath class='f' d='M4.77 10A7.5 7.5 0 1 0 19.23 10Z'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        var requested = new URLSearchParams(window.location.search).get('theme');
        var t = requested === 'light' || requested === 'dark' ? requested : localStorage.getItem('ghcu.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (localStorage.getItem('ghcu.locale') === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {
        console.warn('Could not read the saved theme and language.', e);
      }
    </script>
