name: Feature request
description: Suggest an idea or an improvement
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please do not paste real usage data, user names or emails.
  - type: textarea
    id: problem
    attributes:
      label: What do you need to learn or decide?
      description: Tell us about the question you have as an admin or manager.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought about
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include real usage data, names, emails or screenshots with real data.
          required: true
