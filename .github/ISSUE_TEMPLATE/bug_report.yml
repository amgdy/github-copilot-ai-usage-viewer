name: Bug report
description: Something looks wrong or does not work
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real usage data, user names or emails. Describe what you see in words, or use the **View a sample report** button to show the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it?
      description: List the steps. Say if it also happens with the sample report.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Edge 130 on Windows 11
  - type: dropdown
    id: language
    attributes:
      label: Language in the app
      options:
        - Arabic
        - English
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include real usage data, names, emails or screenshots with real data.
          required: true
